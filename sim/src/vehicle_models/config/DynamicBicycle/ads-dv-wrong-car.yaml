# NOTE: This data is not correct, it is based on the AMZ driverless car

inertia:
  m:        190.0   # Weight of the Vehicle [kg]
  g:        9.81    # Gravity force         [m/s^2]
  I_z:      110     # Inertial force I_zz

kinematic:
  l: 1.53           # Vehicle Length [m]
  w_front: 0.5      # Percentage of weight front
  axle_width: 1.4

tyre:
  A: 12.56
  B: 1.38
  C: 1.60
  radius: 0.2525
  rolling_resistance: 0.0

powertrain:
  overdrive: 0.00

aero:
  C_down: 0.0 # F_Downforce = C_Downforce*v_x^2
  C_drag: 1.0 # F_Drag = C_Drag*v_x^2

input_ranges:
  acceleration:
    max: 3
    min: -5
  velocity:
    max: 30
    min: 0
  steering:
    max: 0.52
    min: -0.52

